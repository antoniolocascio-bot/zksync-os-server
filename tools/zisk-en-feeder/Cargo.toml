[package]
name = "zksync_os_zisk_en_feeder"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "zisk-en-feeder"
path = "src/main.rs"

[dependencies]
# Local server crates — used to reach the existing zisk_input_builder helpers
# without duplicating ~1500 lines of Blake2s merkle-proof and REVM glue code.
zksync_os_server = { path = "../../node/bin" }
zksync_os_types.workspace = true
zksync_os_interface.workspace = true
zksync_os_storage_api.workspace = true
zksync_os_merkle_tree.workspace = true

# External (shared with zisk-batch-test)
zksync-os-zisk-lib.workspace = true

# Raw RocksDB so we can open the EN's database in secondary mode.
rocksdb = "0.24"
bincode = { version = "2.0.1", features = ["serde"] }

alloy = { workspace = true, default-features = false, features = ["eips"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
hex = "0.4"
