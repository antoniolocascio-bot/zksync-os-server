[package]
name = "zksync_os_zisk_batch_test"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# Server crates for types — only lightweight ones, no batch_types
zksync_os_types.workspace = true
zksync_os_interface.workspace = true

# Our ZiSK REVM executor lib
zksync-os-zisk-lib = { path = "../../../zksync-os-zisk/lib" }

# Direct RocksDB access
rocksdb = "0.24"
bincode = { version = "2.0.1", features = ["serde"] }
semver.workspace = true

alloy = { workspace = true, default-features = false, features = ["eips"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json.workspace = true
hex = "0.4"
serde.workspace = true
